name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make -C tests test

  avr-compile:
    name: AVR compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc
      - name: Compile for ATmega328P
        run: |
          avr-g++ -mmcu=atmega328p -DF_CPU=16000000UL \
            -std=gnu++11 -Os -Wall -Wextra -I. \
            -c tests/test_avr_compile.cpp -o /tmp/nonvolatile_avr.o
